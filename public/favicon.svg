<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient: Deep Maritime Navy -->
    <linearGradient id="elvora-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061824" />
      <stop offset="60%" stop-color="#0a2a3d" />
      <stop offset="100%" stop-color="#0e4d6e" />
    </linearGradient>

    <!-- Warm Golden Gradient -->
    <linearGradient id="elvora-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea88" />
      <stop offset="45%" stop-color="#f2c53d" />
      <stop offset="100%" stop-color="#cf9a3c" />
    </linearGradient>

    <!-- Ocean Teal Gradient -->
    <linearGradient id="elvora-teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55e2f2" />
      <stop offset="50%" stop-color="#1f8aa8" />
      <stop offset="100%" stop-color="#0f7d86" />
    </linearGradient>

    <!-- Inner Radial Glow -->
    <radialGradient id="elvora-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f8aa8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#061824" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Squircle Container -->
  <rect width="512" height="512" rx="120" fill="url(#elvora-bg)" />
  
  <!-- Subtle Glowing Core -->
  <circle cx="256" cy="256" r="180" fill="url(#elvora-glow)" />

  <!-- Elegant Inset Gold Border -->
  <rect x="18" y="18" width="476" height="476" rx="104" fill="none" stroke="url(#elvora-gold)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Maritime Emblem -->
  <g>
    <!-- Top Nav Star / Polaris Diamond -->
    <polygon points="256,58 268,88 298,100 268,112 256,142 244,112 214,100 244,88" fill="url(#elvora-gold)" />

    <!-- Upper Vessel Bow / Prow Chevron -->
    <path d="M 124 186 L 256 114 L 388 186" fill="none" stroke="url(#elvora-gold)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Mast / Shaft -->
    <line x1="256" y1="140" x2="256" y2="350" stroke="#f2f8fb" stroke-width="24" stroke-linecap="round" />

    <!-- Horizontal Anchor Stock / Cargo Crossbar -->
    <line x1="184" y1="234" x2="328" y2="234" stroke="url(#elvora-gold)" stroke-width="18" stroke-linecap="round" />

    <!-- Lower Maritime Hull / Anchor Flukes Curve -->
    <path d="M 132 284 C 132 388, 380 388, 380 284" fill="none" stroke="url(#elvora-teal)" stroke-width="26" stroke-linecap="round" />

    <!-- Fluke Arrow Tips (Left & Right) -->
    <polygon points="132,258 110,302 154,302" fill="url(#elvora-teal)" />
    <polygon points="380,258 358,302 402,302" fill="url(#elvora-teal)" />

    <!-- Keel Fin Anchor Tip (Bottom Center) -->
    <polygon points="256,432 230,374 282,374" fill="url(#elvora-gold)" />
  </g>
</svg>
